<svg xmlns="http://www.w3.org/2000/svg" width="680" height="640" viewBox="0 0 680 640" role="img" font-family="'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',sans-serif">
<title>결품 대체품 HITL 파이프라인과 LLM의 위치</title>
<desc>결품 건이 gather, propose(LLM), check를 거쳐 기준 통과 시 send로, 걸리면 review(사람)로 간다. review에서 승인·수정은 send, 다시 판정은 propose, 반려는 escalate로 간다.</desc>
<style>
.code{fill:#F7F6F2;stroke:#B4B2A9}.llm{fill:#EEEDFE;stroke:#534AB7}.human{fill:#FAECE7;stroke:#993C1D}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}
.llm-t{font-size:14px;font-weight:500;fill:#3C3489}.llm-s{font-size:12px;fill:#534AB7}
.hu-t{font-size:14px;font-weight:500;fill:#712B13}.hu-s{font-size:12px;fill:#993C1D}
.arr{stroke:#888780;stroke-width:1.5;fill:none}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="640" fill="#FFFFFF"/>
<rect class="code" x="240" y="30" width="200" height="44" rx="8" stroke-width="0.5"/><text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">결품 건 입력</text>
<line x1="340" y1="74" x2="340" y2="100" class="arr" marker-end="url(#arrow)"/>
<rect class="code" x="220" y="104" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="122" text-anchor="middle" dominant-baseline="central">gather</text><text class="ts" x="340" y="142" text-anchor="middle" dominant-baseline="central">재고 있는 후보 수집 · 코드</text>
<line x1="340" y1="160" x2="340" y2="186" class="arr" marker-end="url(#arrow)"/>
<rect class="llm" x="220" y="190" width="240" height="56" rx="8" stroke-width="0.5"/><text class="llm-t" x="340" y="208" text-anchor="middle" dominant-baseline="central">propose</text><text class="llm-s" x="340" y="228" text-anchor="middle" dominant-baseline="central">LLM · 선정·근거·확신도·안내문</text>
<line x1="340" y1="246" x2="340" y2="272" class="arr" marker-end="url(#arrow)"/>
<rect class="code" x="220" y="276" width="240" height="56" rx="8" stroke-width="0.5"/><text class="th" x="340" y="294" text-anchor="middle" dominant-baseline="central">check</text><text class="ts" x="340" y="314" text-anchor="middle" dominant-baseline="central">멈춤 기준 5개 · 코드</text>
<path d="M340 332 L340 362 L160 362 L160 388" class="arr" marker-end="url(#arrow)"/>
<path d="M340 362 L520 362 L520 388" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="250" y="352" text-anchor="middle">기준 통과</text>
<text class="ts" x="430" y="352" text-anchor="middle">하나라도 걸림</text>
<rect class="code" x="60" y="392" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="160" y="410" text-anchor="middle" dominant-baseline="central">send</text><text class="ts" x="160" y="430" text-anchor="middle" dominant-baseline="central">안내문 발송·발주 변경</text>
<rect class="human" x="420" y="392" width="200" height="56" rx="8" stroke-width="0.5"/><text class="hu-t" x="520" y="410" text-anchor="middle" dominant-baseline="central">review</text><text class="hu-s" x="520" y="430" text-anchor="middle" dominant-baseline="central">담당자 판단 · interrupt</text>
<line x1="420" y1="420" x2="264" y2="420" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="342" y="412" text-anchor="middle">승인 · 수정 후 승인</text>
<path d="M620 420 L650 420 L650 218 L464 218" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="556" y="208" text-anchor="middle">다시 판정 (지시 포함)</text>
<line x1="520" y1="448" x2="520" y2="504" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="530" y="480" text-anchor="start">반려 · 기한 초과</text>
<rect class="code" x="420" y="508" width="200" height="56" rx="8" stroke-width="0.5"/><text class="th" x="520" y="526" text-anchor="middle" dominant-baseline="central">escalate</text><text class="ts" x="520" y="546" text-anchor="middle" dominant-baseline="central">BM 수동 처리 목록</text>
<rect class="llm" x="60" y="600" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="82" y="611">LLM</text>
<rect class="human" x="140" y="600" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="162" y="611">사람</text>
<rect class="code" x="220" y="600" width="14" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="242" y="611">코드 (규칙·저장·발송)</text>
</svg>
